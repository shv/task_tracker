[project]
name = "task-tracker"
version = "0.1.0"
description = "Task management API built with Django and Django REST Framework"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django (>=5.2,<5.3)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "psycopg[binary] (>=3.3.9,<4.0.0)",
    "dj-database-url (>=3.1.2,<4.0.0)",
    "drf-spectacular[sidecar] (>=0.30.0,<0.31.0)",
    "djangorestframework-simplejwt[crypto] (>=5.5.1,<6.0.0)"
]


[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["staticfiles"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
files = ["api", "config", "tasks", "tests", "manage.py"]
plugins = ["mypy_django_plugin.main"]
strict = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pyright]
include = ["api", "config", "tasks", "tests", "manage.py"]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.poetry.group.dev.dependencies]
ruff = "^0.17.5"
pytest = "^9.2.0"
pytest-django = "^4.14.0"
mypy = ">=1.13,<1.20"
django-stubs = {version = ">=6.1.2,<6.2", extras = ["compatible-mypy"]}
pyright = "^1.1.414"
djangorestframework-stubs = "^3.18.2"
