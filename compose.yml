services:
  dev:
    profiles:
      - dev
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        POETRY_DEV_INSTALL: "true"
    depends_on:
      - postgres-dev
    ports:
      - "8089:8000"
    volumes:
      - ./:/code

    environment:
      - TASK_TRACKER_BAK_PG_DSN=postgresql://task_tracker:@postgres-prod:5432/task_tracker
      - TASK_TRACKER_BAK_DJANGO_SECRET_KEY=${TASK_TRACKER_BAK_DJANGO_SECRET_KEY:-}
    networks:
      - task_tracker_net

  migrate-dev:
    profiles:
      - dev
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        POETRY_DEV_INSTALL: "false"
    command: ["poetry", "run", "python", "manage.py", "migrate"]
    depends_on:
      - postgres-dev
    environment:
      - TASK_TRACKER_BAK_PG_DSN=postgresql://task_tracker:@postgres-prod:5432/task_tracker
      - TASK_TRACKER_BAK_DJANGO_SECRET_KEY=${TASK_TRACKER_BAK_DJANGO_SECRET_KEY:-}
    networks:
      - task_tracker_net

  postgres-dev:
    image: postgres:17
    profiles:
      - dev
    environment:
      - POSTGRES_DB=task_tracker
      - POSTGRES_USER=task_tracker
      - POSTGRES_PASSWORD=
    ports:
      - "5445:5432"
    networks:
      - task_tracker_net
    volumes:
      - ./../_local_db/db:/var/lib/postgresql/data

networks:
  task_tracker_net:
    driver: bridge
