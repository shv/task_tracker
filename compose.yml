x-django-environment: &django-environment
  TASK_TRACKER_BAK_PG_DSN: postgresql://task_tracker:task_tracker_dev@postgres-dev:5432/task_tracker
  TASK_TRACKER_BAK_DJANGO_SECRET_KEY: ${TASK_TRACKER_BAK_DJANGO_SECRET_KEY:-}
  TASK_TRACKER_BAK_DJANGO_DEBUG: "true"
  TASK_TRACKER_BAK_DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,[::1]

services:
  dev:
    profiles:
      - dev
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        POETRY_DEV_INSTALL: "true"
    depends_on:
      postgres-dev:
        condition: service_healthy
      migrate-dev:
        condition: service_completed_successfully
    ports:
      - "8089:8000"
    volumes:
      - ./:/code

    environment: *django-environment
    networks:
      - task_tracker_net

  migrate-dev:
    profiles:
      - dev
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        POETRY_DEV_INSTALL: "false"
    command: ["poetry", "run", "python", "manage.py", "migrate"]
    depends_on:
      postgres-dev:
        condition: service_healthy
    environment: *django-environment
    networks:
      - task_tracker_net

  postgres-dev:
    image: postgres:17
    profiles:
      - dev
    environment:
      POSTGRES_DB: task_tracker
      POSTGRES_USER: task_tracker
      POSTGRES_PASSWORD: task_tracker_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    ports:
      - "5445:5432"
    networks:
      - task_tracker_net
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

networks:
  task_tracker_net:
    driver: bridge

volumes:
  postgres_dev_data:
