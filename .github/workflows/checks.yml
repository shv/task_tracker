name: Checks

on: [workflow_call, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: task_tracker
          POSTGRES_USER: task_tracker
          POSTGRES_PASSWORD: task_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_tracker -d task_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TASK_TRACKER_BAK_PG_DSN: postgresql://task_tracker:task_tracker_test@localhost:5432/task_tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: python -m pip install poetry==2.1.2
      - name: Install dependencies
        run: poetry install --with dev --no-interaction
      - name: Check dependencies
        run: poetry check
      - name: Apply migrations
        run: poetry run python manage.py migrate --noinput
      - name: Check Django
        run: poetry run python manage.py check --database default
      - name: Check pending model changes
        run: poetry run python manage.py makemigrations --check --dry-run
      - name: Run checks
        run: make check
